name: CD - Continuous Deployment

# Trigger only on main/master branch (after merge from development)
on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Required for GitHub Pages deployment
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests and generate coverage report
      run: |
        pytest -q --cov=. --cov-report=term --cov-report=xml --cov-report=html
    
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v3
    
    - name: Upload coverage report to Pages
      uses: actions/upload-pages-artifact@v2
      with:
        path: './htmlcov'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
    
    - name: Display deployment URL
      run: |
        echo "🚀 Coverage report deployed!"
        echo "📊 View at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/htmlcov"